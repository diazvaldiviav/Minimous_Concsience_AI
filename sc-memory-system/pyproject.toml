[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-memory-system"
version = "0.1.0"
description = "SC (Sistema de Consolidación) Memory System MVP - Revolutionary memory consolidation for LLMs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SC Memory Team", email = "team@sc-memory.ai"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["llm", "memory", "consolidation", "ai", "ml", "lora", "adapters"]

# Core dependencies with verified compatibility matrix (September 2025)
dependencies = [
    # Web framework
    "fastapi[standard]>=0.116.1,<0.117.0",
    "uvicorn[standard]>=0.25.0,<0.26.0",
    
    # Data validation and settings
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    
    # ML/AI stack - confirmed compatible versions
    "torch>=2.7.1,<2.8.0",
    "transformers>=4.56.1,<5.0.0",
    "sentence-transformers>=3.1.0,<4.0.0",
    
    # Vector storage and compute
    "faiss-cpu>=1.12.0,<1.13.0",
    "numpy>=1.24.0,<2.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
    
    # Performance enhancements
    "orjson>=3.10.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=4.0.0,<5.0.0",
    
    # Code quality
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "mypy>=1.13.0,<2.0.0",
    "flake8>=7.0.0,<8.0.0",
    
    # Documentation
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.0.0,<10.0.0",
]

gpu = [
    "faiss-gpu>=1.12.0,<1.13.0",
]

[project.urls]
Homepage = "https://github.com/sc-memory/sc-memory-system"
Repository = "https://github.com/sc-memory/sc-memory-system"
Documentation = "https://sc-memory.readthedocs.io"
Issues = "https://github.com/sc-memory/sc-memory-system/issues"

[project.scripts]
sc-memory = "src.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Black configuration
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
known_first_party = ["src"]

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "sentence_transformers.*",
    "transformers.*",
    "torch.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod",
]