# Model Configuration for Consciousness Pipeline
# ===============================================
# Defines model selection for different phases of consciousness processing

models:
  # Phase 2: Consciousness state generation  
  consciousness: "gpt-4o-mini"
  
  # Phase 4: Automatic thoughts and LLM communication
  automatic_thoughts: "local_mistral"  # Uses existing Mistral integration
  
  # Phase 7: Final response generation (configurable)
  final_response: "gpt-4o-mini"
  
  # Available OpenAI models for Phase 7
  available_models:
    - "gpt-4o-mini"      # Fast, cost-effective, good for most tasks
    - "gpt-4o"           # Most capable, higher cost
    - "gpt-3.5-turbo"    # Reliable fallback
    - "gpt-4-turbo"      # Previous generation, still capable

# API Configuration
api:
  openai:
    # API key should be set via environment variable OPENAI_API_KEY
    timeout: 30  # seconds
    max_retries: 3
    
# Token limits per model
token_limits:
  "gpt-4o-mini":
    max_input: 128000
    max_output: 16384
  "gpt-4o":
    max_input: 128000
    max_output: 16384
  "gpt-3.5-turbo":
    max_input: 16384
    max_output: 4096
  "gpt-4-turbo":
    max_input: 128000
    max_output: 4096

# Default parameters for different phases
parameters:
  consciousness_generation:
    temperature: 0.7
    presence_penalty: 0.1
    frequency_penalty: 0.1
    
  final_response:
    temperature: 0.7
    max_tokens: 1000
    presence_penalty: 0.1
    frequency_penalty: 0.1
    
  fallback:
    temperature: 0.6
    max_tokens: 500

# Debug settings
debug:
  log_model_usage: true
  save_prompts: false  # Set to true for development
  verbose_errors: true